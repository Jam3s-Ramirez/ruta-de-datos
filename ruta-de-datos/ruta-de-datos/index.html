<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ruta de Datos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: celular = una columna con navegación inferior; laptop = barra lateral con el temario y lecciones en dos columnas (explicación | editor). */
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --sunk:#E3EBE8; --ink:#14201C; --muted:#56665F; --line:#D3DDD9;
  --py:#0A7458; --py-soft:#D5EEE6; --sql:#3343A0; --sql-soft:#DEE2F7;
  --code-bg:#11201B; --code-fg:#E1ECE7; --code-dim:#7F958D; --code-line:#22362F; --code-err:#F49384;
  --ok:#1C7F45; --ok-soft:#DAF0E2; --bad:#B1372A; --bad-soft:#F8E0DC; --warn:#8F5C00; --warn-soft:#F7EBD2;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --acc:var(--py); --acc-soft:var(--py-soft);
  --side-w:288px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1311; --surface:#141D1A; --sunk:#0F1714; --ink:#E2ECE7; --muted:#90A39B; --line:#24332E;
  --py:#3FC69C; --py-soft:#123329; --sql:#93A1FF; --sql-soft:#1C2347;
  --code-bg:#08100D; --code-fg:#DCE8E2; --code-dim:#6D847B; --code-line:#1A2A24; --code-err:#F49384;
  --ok:#55C985; --ok-soft:#12301F; --bad:#F08273; --bad-soft:#3A1B16; --warn:#E3B04F; --warn-soft:#33270F;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C1311; --surface:#141D1A; --sunk:#0F1714; --ink:#E2ECE7; --muted:#90A39B; --line:#24332E;
  --py:#3FC69C; --py-soft:#123329; --sql:#93A1FF; --sql-soft:#1C2347;
  --code-bg:#08100D; --code-fg:#DCE8E2; --code-dim:#6D847B; --code-line:#1A2A24; --code-err:#F49384;
  --ok:#55C985; --ok-soft:#12301F; --bad:#F08273; --bad-soft:#3A1B16; --warn:#E3B04F; --warn-soft:#33270F;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.t-py{--acc:var(--py);--acc-soft:var(--py-soft)} .t-sql{--acc:var(--sql);--acc-soft:var(--sql-soft)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;min-height:54px;padding-block:6px}
.brand{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;min-width:0}
.brand .dot{width:10px;height:10px;border-radius:3px;background:var(--py);box-shadow:12px 0 0 var(--sql);margin-right:14px;flex:none}
.brand span.txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{margin-left:auto;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.back{border:0;background:var(--sunk);color:var(--ink);width:36px;height:36px;border-radius:10px;font-size:20px;line-height:1;cursor:pointer;flex:none}
main{padding-block:18px 110px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
h3{font-size:17px;font-weight:600}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.stack-lg{display:flex;flex-direction:column;gap:26px;min-width:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.muted{color:var(--muted)}
.small{font-size:14px}
code,.mono{font-family:var(--f-mono);font-size:.88em}
p code,li code,.q code,.enun code,.opt code{background:var(--sunk);padding:1px 5px;border-radius:5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
button{font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:700;font-size:15px;cursor:pointer;min-height:42px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--surface)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
:is(.btn,.opt,.chip,.navb,.row,.kb,.seg button,.sl,.pl,.pa button,.trk,.continue):focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.new{background:var(--sunk);color:var(--muted)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.bug{background:var(--bad-soft);color:var(--bad)}

/* Selector de modo */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--sunk);gap:3px}
.seg button{border:0;background:transparent;color:var(--muted);border-radius:7px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg svg{width:16px;height:16px;flex:none}
.modecard{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.modecard p{flex:1 1 220px}

/* Inicio */
.hero{display:flex;flex-direction:column;gap:10px}
.hero p{max-width:62ch}
.continue{display:flex;align-items:center;gap:14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;text-align:left;width:100%;color:inherit}
.continue .tag{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--acc);background:var(--acc-soft);border-radius:8px;padding:6px 8px;flex:none}
.continue .go{margin-left:auto;font-size:22px;color:var(--acc)}
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trk{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;cursor:pointer;text-align:left;color:inherit;display:flex;flex-direction:column;gap:8px;min-width:0}
.trk .name{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--acc)}
.lv{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.lv .n{font-variant-numeric:tabular-nums}
.method{counter-reset:m;display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.method li{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.method li:first-child{border-top:0}
.method li::before{counter-increment:m;content:counter(m);font-family:var(--f-mono);font-weight:600;font-size:13px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--sunk);color:var(--ink)}
.method b{display:block}
.method span{font-size:14px;color:var(--muted)}

/* Lista de lecciones */
.lvhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lvhead .small{color:var(--muted)}
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;padding:14px;border:0;border-top:1px solid var(--line);background:transparent;color:inherit;text-align:left;cursor:pointer;width:100%}
.row:first-child{border-top:0}
.row .n{font-family:var(--f-mono);font-weight:600;color:var(--acc);font-size:14px}
.row .t{font-family:var(--f-display);font-weight:600;font-size:17px}

/* Lección */
.steps{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--surface)}
.chip.ok::after{content:" ✓";color:var(--ok)}
.chip.on.ok::after{color:var(--surface)}
.lead{font-size:18px;line-height:1.55;max-width:64ch}
.cmds{display:grid;grid-template-columns:1fr;gap:0}
.cmd{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-top:1px solid var(--line);min-width:0}
.cmd:first-child{border-top:0;padding-top:0}
.cmd .syn{font-family:var(--f-mono);font-weight:600;font-size:15px;color:var(--acc);overflow-wrap:anywhere}
.cmd .ex{font-family:var(--f-mono);font-size:13.5px;background:var(--code-bg);color:var(--code-fg);border-radius:10px;padding:9px 11px;overflow-x:auto;white-space:pre}
.cmd .ex .r{color:var(--code-dim)}
.cmd .eq{font-size:13px;color:var(--muted)}
.cmd .eq code{font-family:var(--f-mono);color:var(--sql);background:var(--sql-soft);padding:1px 6px;border-radius:5px;overflow-wrap:anywhere}
.errs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.errs li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:15px}
.errs li::before{content:"!";font-family:var(--f-mono);font-weight:700;color:var(--bad);background:var(--bad-soft);border-radius:6px;width:22px;height:22px;display:grid;place-items:center;font-size:13px}
.stepnav{display:flex;justify-content:space-between;gap:10px;padding-top:8px}
.box{border-radius:12px;padding:12px 14px;font-size:15px}
.box.info{background:var(--acc-soft)}
.box.ok{background:var(--ok-soft);color:var(--ok)}
.box.bad{background:var(--bad-soft);color:var(--bad)}
.box.warn{background:var(--warn-soft);color:var(--warn)}
.box.link{border:1px dashed var(--acc);background:transparent}
.box b{color:inherit}
details.inv{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.inv summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none}
details.inv summary::-webkit-details-marker{display:none}
details.inv summary::before{content:"▸ ";color:var(--acc)}
details.inv[open] summary::before{content:"▾ "}
details.inv .in{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
details.ref .in .cmd{padding:8px 0}
details.ref .in .cmd .syn{font-size:13.5px}
details.ref .in .cmd div:not(.syn){font-size:14px}
.note{display:flex;flex-direction:column;gap:2px}
.note code{font-family:var(--f-mono);font-size:13px;color:var(--acc);background:none;padding:0;overflow-wrap:anywhere}
.note span{font-size:15px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:11px 13px;cursor:pointer;font-size:15px}
.opt.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;color:var(--ink)}
.enun{font-size:16px}
.exhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.exhead h3{margin-right:auto}
ol.pasos{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.hint{font-size:15px;border-left:3px solid var(--warn);padding:4px 0 4px 10px}

/* Editor */
.ed{border-radius:12px;overflow:hidden;background:var(--code-bg);border:1px solid var(--code-line);min-width:0}
.ed textarea{display:block;width:100%;min-height:150px;resize:vertical;border:0;background:transparent;color:var(--code-fg);font-family:var(--f-mono);font-size:16px;line-height:1.5;padding:12px;tab-size:4;white-space:pre;overflow-x:auto;caret-color:var(--py)}
.t-sql .ed textarea{caret-color:var(--sql)}
.ed textarea:focus{outline:none}
.kbar{display:flex;gap:4px;overflow-x:auto;padding:6px;border-top:1px solid var(--code-line);scrollbar-width:none}
.kbar::-webkit-scrollbar{display:none}
.kb{flex:none;min-width:38px;height:36px;border:1px solid var(--code-line);background:var(--code-line);color:var(--code-fg);border-radius:8px;font-family:var(--f-mono);font-size:15px;cursor:pointer;padding:0 8px}
.edbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px;border-top:1px solid var(--code-line)}
.edbar .btn{min-height:38px;padding:7px 12px;font-size:14px;background:var(--code-line);border-color:var(--code-line);color:var(--code-fg)}
.edbar .btn.primary{background:var(--acc);border-color:var(--acc);color:var(--surface)}
.edbar .kbd{margin-left:auto;font-size:12px;color:var(--code-dim);font-family:var(--f-mono)}
.out{font-family:var(--f-mono);font-size:13px;line-height:1.45;white-space:pre;color:var(--code-fg);padding:10px 12px;border-top:1px solid var(--code-line);max-height:360px;overflow:auto}
.out .err{color:var(--code-err);white-space:pre-wrap}
.out .dim{color:var(--code-dim);white-space:pre-wrap}
.verdict{padding:10px 12px;font-family:var(--f-body);font-size:15px;border-top:1px solid var(--code-line)}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict.warn{background:var(--warn-soft);color:var(--warn)}
.tscroll{overflow-x:auto}
table.res{border-collapse:collapse;font-family:var(--f-mono);font-size:13px;min-width:100%}
table.res th,table.res td{padding:5px 10px;border-bottom:1px solid var(--code-line);text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
table.res th{color:var(--code-dim);font-weight:600}
.schema{padding:10px 12px;border-top:1px solid var(--code-line);color:var(--code-fg);font-family:var(--f-mono);font-size:13px;display:flex;flex-direction:column;gap:6px;white-space:normal}
.schema b{color:var(--acc)}

/* Ordenar bloques (Parsons) */
.pz{display:flex;flex-direction:column;gap:10px}
.pzlabel{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pans,.ppool{display:flex;flex-direction:column;gap:6px;min-height:52px;border-radius:12px;padding:8px}
.pans{background:var(--code-bg);border:1px solid var(--code-line)}
.ppool{border:1px dashed var(--line);background:var(--sunk)}
.pans:empty::before{content:"Toca los bloques de abajo en el orden correcto";color:var(--code-dim);font-size:14px;padding:6px}
.ppool:empty::before{content:"No quedan bloques. Presiona Comprobar.";color:var(--muted);font-size:14px;padding:6px}
.pl,.sl{font-family:var(--f-mono);font-size:13.5px;white-space:pre;overflow-x:auto;text-align:left;border-radius:8px;padding:8px 10px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.pa{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px;align-items:stretch}
.pa .sl{background:var(--code-line);border-color:var(--code-line);color:var(--code-fg);cursor:default}
.pa button{border:1px solid var(--code-line);background:transparent;color:var(--code-fg);border-radius:8px;width:34px;cursor:pointer;font-size:14px}

/* Navegación inferior (celular) */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.bottom .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.navb{border:0;background:transparent;color:var(--muted);padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:700;cursor:pointer}
.navb .ic{font-family:var(--f-mono);font-size:15px;font-weight:600;height:22px;display:grid;place-items:center}
.navb.on{color:var(--ink)}
.navb.on .ic{color:var(--acc)}
.badge{background:var(--bad);color:var(--surface);border-radius:999px;font-size:10px;padding:0 5px;margin-left:4px;font-weight:700}

/* Barra lateral (laptop) */
aside.side{display:none}
body.m-laptop header.top, body.m-laptop nav.bottom{display:none}
body.m-laptop aside.side{display:flex;flex-direction:column;gap:14px;position:fixed;top:0;bottom:0;left:0;width:var(--side-w);overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px 24px;z-index:5}
body.m-laptop main{margin-left:var(--side-w);padding-block:28px 60px}
body.m-laptop .wrap{max-width:1180px;padding-left:32px;padding-right:32px}
.side .brand{padding:0 6px}
.side .seg{align-self:flex-start;margin:0 6px}
.snav{display:flex;flex-direction:column;gap:2px}
.snav button{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);border-radius:8px;padding:8px 10px;font-weight:700;font-size:15px;cursor:pointer;text-align:left}
.snav button.on{background:var(--sunk)}
.sgroup{display:flex;flex-direction:column;gap:2px}
.sgroup h4{margin:10px 10px 4px;font-family:var(--f-display);font-size:16px;color:var(--acc)}
.sgroup .lvt{margin:6px 10px 2px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.slink{display:grid;grid-template-columns:28px 1fr 10px;align-items:center;gap:6px;border:0;background:transparent;color:var(--ink);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer;text-align:left}
.slink .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.slink .d{width:8px;height:8px;border-radius:50%;background:var(--line)}
.slink .d.mid{background:var(--warn)} .slink .d.done{background:var(--ok)}
.slink.on{background:var(--acc-soft);font-weight:700}
.slink:focus-visible,.snav button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}

body.m-laptop h1{font-size:34px}
body.m-laptop .cmds{grid-template-columns:1fr 1fr;column-gap:28px}
body.m-laptop .cmds .cmd:nth-child(2){border-top:0;padding-top:0}
body.m-laptop .split{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;align-items:start}
body.m-laptop .split > .right{position:sticky;top:20px}
body.m-laptop .ed textarea{font-size:14px}
body.m-laptop .kbar{display:none}
body.m-phone .edbar .kbd{display:none}
body.m-laptop .tracks{grid-template-columns:repeat(2,minmax(0,1fr))}
body.m-laptop .homegrid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:28px;align-items:start}
.homegrid{display:flex;flex-direction:column;gap:26px}
@media (prefers-reduced-motion: no-preference){ .bar i{transition:width .4s ease} }
</style>
</head>
<body>


<aside class="side t-py" id="side" aria-label="Temario"></aside>
<header class="top"><div class="wrap" id="topbar"></div></header>
<main><div class="wrap" id="view"></div></main>
<nav class="bottom" aria-label="Secciones"><div class="in" id="nav"></div></nav>

<script>
window.CURSO = {
sqlSchema: `
CREATE TABLE clientes (id INTEGER PRIMARY KEY, nombre TEXT, ciudad TEXT, segmento TEXT, email TEXT, registro TEXT);

function b64Response(url){

function friendlyPy(msg, phase){
  const lines=String(msg).trim().split('\n');
  let last=lines[lines.length-1]||'';
  let lineNo=null;
  for(const ln of lines){ const m=ln.match(/File "<exec>", line (\d+)/); if(m) lineNo=m[1]; }
  last=last.replace(/Ellipsis/g,'... (sin completar)').replace(/'ellipsis'/g,"'...' (sin completar)");
  const at = lineNo && phase==='code' ? ' (línea '+lineNo+')' : '';
  let m;
  if(last.startsWith('AssertionError')){ const t=last.replace(/^AssertionError:?\s*/,''); return {friendly: t||'El resultado no es el esperado.', raw:''}; }
  if((m=last.match(/^NameError: name '(\w+)' is not defined/))){
    return {friendly: phase==='test' ? 'Falta crear la variable o función '+m[1]+'.' : 'No existe nada llamado '+m[1]+at+'. Revisa cómo lo escribiste o si te falta crearlo antes.', raw:last};
  }
  if(last.startsWith('IndentationError')) return {friendly:'Error de indentación'+at+'. Lo que va dentro de for, if, def, try o with lleva 4 espacios más que la línea con los dos puntos.', raw:last};
  if(last.startsWith('SyntaxError')) return {friendly:'Error de sintaxis'+at+'. Revisa paréntesis, comillas y los dos puntos (:) al final de for, if, def, try y with.', raw:last};
  if(/truth value of a Series is ambiguous/.test(last)) return {friendly:'Con Series no se usa and / or'+at+'. Usa & y | y pon cada condición entre paréntesis.', raw:last};
  const tr={TypeError:'Error de tipo: estás mezclando datos que no se pueden operar juntos',ValueError:'Valor inválido',KeyError:'Esa clave o columna no existe',IndexError:'Esa posición no existe',ZeroDivisionError:'División entre cero',AttributeError:'Ese método o atributo no existe para ese tipo de dato',FileNotFoundError:'No existe ese archivo'};
  const k=Object.keys(tr).find(k=>last.startsWith(k));
  return {friendly:(k?tr[k]:'Error')+at+'.', raw:last};
}

async function runPython(code, tests, pkgs, onStage){

function outerOrder(q){ let s=q.replace(/--.*$/gm,''); let prev; do{ prev=s; s=s.replace(/\([^()]*\)/g,''); }while(s!==prev); return /order\s+by/i.test(s); }
function runSqlRaw(SQL, q, check){
  const db=new SQL.Database();
  try{ db.run(C.sqlSchema); let r=db.exec(q); if(check) r=db.exec(check); return {res:r.length?r[r.length-1]:null}; }
  catch(e){ return {error:e.message}; }
  finally{ db.close(); }
}
const norm = v => typeof v==='number' ? Math.round(v*1e6)/1e6 : (v===null?null:String(v).trim());
async function runSql(q, solution, check, onStage){
  if(!sqlP) onStage&&onStage('Cargando SQL…');
  const SQL=await getSql();
  const u=runSqlRaw(SQL,q,check);
  if(u.error) return {ok:false, err:{friendly:sqlFriendly(u.error), raw:u.error}};
  if(!solution) return {ok:true, res:u.res};
  const s=runSqlRaw(SQL,solution,check).res;
  if(!u.res) return {ok:false,res:null,err:{friendly:'Tu consulta no devolvió filas. ¿Escribiste un SELECT?',raw:''}};
  const uc=u.res.columns.length, sc=s.columns.length;
  if(uc!==sc) return {ok:false,res:u.res,err:{friendly:'Tu resultado tiene '+uc+' columna'+(uc>1?'s':'')+' y se esperaban '+sc+'. Revisa las columnas del SELECT.',raw:''}};
  const ur=u.res.values.map(r=>r.map(norm)), sr=s.values.map(r=>r.map(norm));
  if(ur.length!==sr.length) return {ok:false,res:u.res,err:{friendly:'Tu resultado tiene '+ur.length+' fila'+(ur.length===1?'':'s')+' y se esperaban '+sr.length+'. Revisa el filtro (WHERE, HAVING, JOIN) o el LIMIT.',raw:''}};
  const ordered=outerOrder(check||solution);
  const key=r=>JSON.stringify(r);
  if(ur.every((r,i)=>key(r)===key(sr[i]))) return {ok:true,res:u.res};
  const us=ur.map(key).sort(), ss=sr.map(key).sort();
  if(us.every((r,i)=>r===ss[i])){
    if(ordered) return {ok:false,res:u.res,err:{friendly:'Las filas son correctas, pero el orden no. Revisa el ORDER BY (¿ASC o DESC?).',raw:''}};
    return {ok:true,res:u.res};
  }
  return {ok:false,res:u.res,err:{friendly:'Tienes el número correcto de filas y columnas, pero algunos valores no coinciden. Revisa columnas, cálculos y condiciones.',raw:''}};
}
function sqlFriendly(e){
  if(/no such table/.test(e)) return 'Esa tabla no existe. Las tablas son clientes, productos y ventas (más las que tú crees).';
  if(/no such column/.test(e)) return 'Esa columna no existe. Abre "Tablas" para ver los nombres exactos.';
  if(/misuse of (aliased )?window function/.test(e)) return 'Una función de ventana no se puede usar en WHERE. Calcúlala en una CTE y filtra afuera.';
  if(/syntax error/.test(e)) return 'Error de sintaxis. Revisa comas, paréntesis, comillas simples en los textos y el orden SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY → LIMIT.';
  if(/ambiguous column/.test(e)) return 'Esa columna existe en dos tablas. Escribe alias.columna.';
  if(/constraint failed/.test(e)) return 'La fila no cumple una restricción de la tabla (NOT NULL, UNIQUE o CHECK).';
  if(/aggregate/.test(e)) return 'Uso incorrecto de una función de agregado. Para filtrar por SUM o COUNT usa HAVING.';
  return 'La consulta tiene un error.';
}

  ta.value = (opts.key && S.drafts[opts.key]!=null) ? S.drafts[opts.key] : opts.code;
  const fit=()=>{ const lines=ta.value.split('\n').length; ta.rows=Math.max(isLap?8:5,Math.min(lines+1,isLap?28:22)); };
  fit();
  const insert=(txt)=>{ const a=ta.selectionStart,b=ta.selectionEnd; ta.setRangeText(txt,a,b,'end'); ta.dispatchEvent(new Event('input')); };
  ta.addEventListener('input',()=>{ fit(); if(opts.key){ S.drafts[opts.key]=ta.value; save(); } });
  ta.addEventListener('keydown',e=>{
    if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); go(opts.mode==='check' && !e.shiftKey); return; }
    if(e.key==='Tab' && !e.shiftKey){ e.preventDefault(); insert('    '); return; }
    if(e.key==='Tab' && e.shiftKey){
      e.preventDefault();
      const v=ta.value, a=ta.selectionStart, ls=v.lastIndexOf('\n',a-1)+1;
      const m=v.slice(ls).match(/^ {1,4}/); if(m){ ta.setRangeText('',ls,ls+m[0].length,'preserve'); ta.dispatchEvent(new Event('input')); }
    }
  });
  ta.addEventListener('beforeinput',e=>{
    if(opts.lang!=='py') return;
    if(e.inputType==='insertLineBreak'||e.inputType==='insertParagraph'){
      const before=ta.value.slice(0,ta.selectionStart); const line=before.split('\n').pop();
      let ind=(line.match(/^ */)||[''])[0];
      if(/:\s*$/.test(line)) ind+='    ';
      e.preventDefault(); insert('\n'+ind);
    }
  });
  box.appendChild(ta);
  const kbar=document.createElement('div'); kbar.className='kbar';
  KEYS[opts.lang].forEach(k=>{ const b=document.createElement('button'); b.type='button'; b.className='kb'; b.textContent=k; b.setAttribute('aria-label', k==='⇥'?'Insertar 4 espacios':'Insertar '+k);
    b.addEventListener('pointerdown',e=>e.preventDefault());
    b.addEventListener('click',()=>{ ta.focus(); insert(k==='⇥'?'    ':k); });
    kbar.appendChild(b); });
  box.appendChild(kbar);
  const bar=document.createElement('div'); bar.className='edbar';
  const runB=document.createElement('button'); runB.className='btn primary'; runB.type='button'; runB.textContent= opts.mode==='check' ? 'Comprobar' : 'Ejecutar';
  bar.appendChild(runB);
  if(opts.mode==='check'){
    const tryB=document.createElement('button'); tryB.className='btn'; tryB.type='button'; tryB.textContent='Solo ejecutar';
    tryB.addEventListener('click',()=>go(false)); bar.appendChild(tryB);
  }
  if(opts.lang==='sql'){
    const tb=document.createElement('button'); tb.className='btn'; tb.type='button'; tb.textContent='Tablas';
    tb.addEventListener('click',()=>{ schema.hidden=!schema.hidden; }); bar.appendChild(tb);
  }
  const resetB=document.createElement('button'); resetB.className='btn'; resetB.type='button'; resetB.textContent='Reiniciar';
  resetB.addEventListener('click',()=>{ ta.value=opts.code; ta.dispatchEvent(new Event('input')); out.hidden=true; verdict.hidden=true; });
  bar.appendChild(resetB);
  const kbd=document.createElement('span'); kbd.className='kbd'; kbd.textContent = opts.mode==='check' ? 'Ctrl+Enter comprueba' : 'Ctrl+Enter ejecuta'; bar.appendChild(kbd);
  box.appendChild(bar);
  const schema=document.createElement('div'); schema.className='schema'; schema.hidden=true; schema.innerHTML=SCHEMA_HTML;
  box.appendChild(schema);
  const out=document.createElement('div'); out.className='out'; out.hidden=true; box.appendChild(out);
  const verdict=document.createElement('div'); verdict.className='verdict'; verdict.hidden=true; box.appendChild(verdict);

  let busy=false;
  async function go(check){
    if(busy) return;
    if(opts.gate && !opts.gate()) return;
    const code=ta.value;
    out.hidden=false; verdict.hidden=true;
    if(check && code.includes('___')){ out.hidden=true; showV('warn','Todavía hay espacios ___ por completar.'); return; }
    if(check && opts.lang==='py' && /(=\s*\.\.\.\s*$)|(^\s*\.\.\.\s*$)/m.test(code)){ out.hidden=true; showV('warn','Todavía hay <code>...</code> por completar. Reemplaza los tres puntos por tu código.'); return; }
    const stage=t=>{ out.innerHTML='<span class="dim">'+ESC(t)+'</span>'; };
    stage('Ejecutando…');
    busy=true; runB.disabled=true;
    try{
      if(opts.lang==='py'){
        const r=await runPython(code, check?opts.tests:null, opts.pkgs, stage);
        let html=r.out?ESC(r.out):'';
        if(!r.ok && r.err && !r.testFail){ html+='<span class="err">'+ESC(r.err.friendly)+(r.err.raw?'\n'+ESC(r.err.raw):'')+'</span>'; }
        out.innerHTML = html || '<span class="dim">(sin salida en pantalla)</span>';
        if(check){ if(r.ok){ showV('ok','¡Correcto! Pasó todas las pruebas.'); opts.onPass&&opts.onPass(); } else if(r.testFail){ showV('bad', r.err.raw ? 'Tu código corrió, pero el resultado no tiene la forma esperada. '+ESC(r.err.raw) : ESC(r.err.friendly)); } else showV('bad','Corrige el error y vuelve a comprobar.'); }
        if(opts.after) opts.after(r);
      } else {
        const r=await runSql(code, check?opts.solution:null, opts.check, stage);
        out.innerHTML = r.res ? tableHTML(r.res) : (r.ok?'<span class="dim">(la instrucción no devolvió filas)</span>':'');
        if(!r.ok && r.err && r.err.raw){ out.innerHTML+='<span class="err">'+ESC(r.err.friendly)+'\n'+ESC(r.err.raw)+'</span>'; }
        if(check){ if(r.ok){ showV('ok','¡Correcto! El resultado coincide con el esperado.'); opts.onPass&&opts.onPass(); } else showV('bad', r.err.raw ? 'Corrige el error y vuelve a comprobar.' : ESC(r.err.friendly)); }
        if(opts.after) opts.after(r);
      }
    }catch(e){
      out.innerHTML='<span class="err">No se pudo iniciar el motor de '+(opts.lang==='py'?'Python':'SQL')+'. Revisa tu conexión y vuelve a intentar.\n'+ESC(e.message||e)+'</span>';
    }finally{ busy=false; runB.disabled=false; }
  }
  function showV(kind,msg){ verdict.className='verdict '+kind; verdict.innerHTML=msg; verdict.hidden=false; }
  runB.addEventListener('click',()=>go(opts.mode==='check'));
  box._run=go; box._ta=ta;
  return box;
}
function tableHTML(r){
  const rows=r.values.slice(0,50);
  let h='<div class="tscroll"><table class="res"><thead><tr>'+r.columns.map(c=>'<th>'+ESC(c)+'</th>').join('')+'</tr></thead><tbody>';
  rows.forEach(v=>{ h+='<tr>'+v.map(x=>'<td>'+(x===null?'<span class="dim">NULL</span>':ESC(typeof x==='number'&&!Number.isInteger(x)?Math.round(x*100)/100:x))+'</td>').join('')+'</tr>'; });
  h+='</tbody></table></div><span class="dim">'+r.values.length+' fila'+(r.values.length===1?'':'s')+(r.values.length>50?' (se muestran 50)':'')+'</span>';
  return h;
}

/* ---------- ordenar bloques (Parsons) ---------- */
function seeded(str){ let h=2166136261; for(const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return ()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%10000)/10000; }; }
function parsonsBlock(l, onPass){
  const P=l.parsons, lines=P.lineas.map((t,i)=>({t,i}));
  const rnd=seeded(l.id); let pool=[...lines];
  for(let k=0;k<20;k++){ for(let i=pool.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; } if(pool.some((x,i)=>x.i!==i)) break; }
  let ans=[];
  const wrap=document.createElement('div'); wrap.className='pz';
  wrap.innerHTML='<div class="pzlabel">Tu código</div><div class="pans"></div><div class="pzlabel">Bloques disponibles</div><div class="ppool"></div><div class="btnrow"><button type="button" class="btn primary pchk">Comprobar</button><button type="button" class="btn prst">Reiniciar</button></div><div class="pres"></div>';
  const A=wrap.querySelector('.pans'), Pp=wrap.querySelector('.ppool'), res=wrap.querySelector('.pres');
  function draw(){
    A.innerHTML=''; Pp.innerHTML='';
    ans.forEach((x,k)=>{
      const row=document.createElement('div'); row.className='pa';
      row.innerHTML='<div class="sl">'+ESC(x.t)+'</div><button type="button" aria-label="Subir línea">↑</button><button type="button" aria-label="Quitar línea">✕</button>';
      const [up,rm]=row.querySelectorAll('button');
      up.disabled=k===0; up.onclick=()=>{ [ans[k-1],ans[k]]=[ans[k],ans[k-1]]; draw(); };
      rm.onclick=()=>{ ans.splice(k,1); pool.push(x); draw(); };
      A.appendChild(row);
    });
    pool.forEach((x,k)=>{ const b=document.createElement('button'); b.type='button'; b.className='pl'; b.textContent=x.t; b.onclick=()=>{ pool.splice(k,1); ans.push(x); draw(); }; Pp.appendChild(b); });
  }
  draw();
  wrap.querySelector('.prst').onclick=()=>{ pool=pool.concat(ans); ans=[]; res.innerHTML=''; draw(); };
  wrap.querySelector('.pchk').onclick=async()=>{
    if(pool.length){ res.innerHTML='<div class="box warn">Te faltan '+pool.length+' bloque'+(pool.length>1?'s':'')+' por colocar.</div>'; return; }
    const code=ans.map(x=>x.t).join('\n');
    const ed=document.createElement('div'); ed.className='ed'; const out=document.createElement('div'); out.className='out'; ed.appendChild(out);
    res.innerHTML=''; res.appendChild(ed);
    const stage=t=>{ out.innerHTML='<span class="dim">'+ESC(t)+'</span>'; };
    try{
      let ok, msg;
      if(l.track==='py'){
        const r=await runPython(code, P.tests, l.pkgs, stage);
        out.innerHTML = r.out ? ESC(r.out) : '<span class="dim">(sin salida en pantalla)</span>';
        ok=r.ok; msg = ok ? '' : (r.testFail ? r.err.friendly : r.err.friendly+(r.err.raw?' · '+r.err.raw:''));
      } else {
        const r=await runSql(code, P.lineas.join('\n'), P.check, stage);
        out.innerHTML = r.res ? tableHTML(r.res) : '';
        ok=r.ok; msg = ok ? '' : r.err.friendly+(r.err.raw?' · '+r.err.raw:'');
      }
      const v=document.createElement('div'); v.className='verdict '+(ok?'ok':'bad');
      v.innerHTML = ok ? '¡Correcto! Ese orden funciona.' : 'Todavía no. '+ESC(msg)+' Revisa el orden y la indentación.';
      ed.appendChild(v);
      if(ok) onPass&&onPass();
    }catch(e){ out.innerHTML='<span class="err">No se pudo ejecutar. Revisa tu conexión.\n'+ESC(e.message||e)+'</span>'; }
  };
  return wrap;
}

function quizBlock(q, qid, onAnswer){
  const wrap=document.createElement('div'); wrap.className='stack';
  wrap.innerHTML='<p class="q enun">'+q.p+'</p>';
  const opts=document.createElement('div'); opts.className='opts';
  const fb=document.createElement('div'); fb.hidden=true;
  q.o.forEach((o,i)=>{
    const b=document.createElement('button'); b.type='button'; b.className='opt'; b.textContent=o;
    b.addEventListener('click',()=>{
      const right=i===q.c;
      [...opts.children].forEach((x,j)=>{ x.disabled=true; if(j===q.c) x.classList.add('right'); });
      if(!right) b.classList.add('wrong');
      fb.className='box '+(right?'ok':'bad'); fb.innerHTML='<b>'+(right?'Correcto.':'No exactamente.')+'</b> '+q.w; fb.hidden=false;
      grade(qid,right); onAnswer&&onAnswer(right);
    });
    opts.appendChild(b);
  });
  wrap.appendChild(opts); wrap.appendChild(fb);
  return wrap;
}

    : {1:'Consultas sobre una base de ventas con tres tablas: clientes, productos y ventas. Del SELECT básico hasta unir tablas.',2:'CASE y NULL, texto y fechas, subconsultas, CTE, funciones de ventana, y crear y modificar tablas.'};
  const sec=n=>{ const ls=trackLessons(t).filter(l=>l.nivel===n); return `<section class="stack"><div class="lvhead"><h2>${LVNAME[n]}</h2></div><p class="small muted">${desc[n]}</p><div class="rows">${ls.map(l=>{const st=lessonState(l);return `<button type="button" class="row" data-id="${l.id}"><span class="n">${String(numIn(l)).padStart(2,'0')}</span><span><span class="t">${ESC(l.titulo)}</span><br><span class="small muted">${ESC(l.sub)}</span></span><span class="pill ${st}">${lab[st]}</span></button>`}).join('')}</div></section>`; };
  $view.innerHTML=`<div class="stack-lg"><section class="hero"><span class="eyebrow">${TRK[t]}</span><h1>${t==='py'?'Python para datos':'SQL para análisis'}</h1></section>${sec(1)}${sec(2)}</div>`;
  $view.querySelectorAll('.row').forEach(b=>b.onclick=()=>openLesson(b.dataset.id));
}

function viewLesson(){
  const v=S.view, l=byId[v.id], keys=stepsOf(l);
  let step = typeof v.step==='string' && keys.includes(v.step) ? v.step : (typeof v.step==='number' ? (keys[v.step]||'para') : 'para');
  const si=keys.indexOf(step);
  S.seen[l.id]={step}; save();
  const lang=l.track;
  const okOf = k => k==='guia' ? !!S.done['g:'+l.id] : k==='parsons' ? !!S.done['p:'+l.id] : k==='ejer' ? l.ejercicios.every((_,i)=>S.done['e:'+l.id+':'+i]) : false;
  $view.innerHTML=`<div class="stack-lg">
    ${mode()==='laptop'?`<div class="stack"><span class="eyebrow">${TRK[l.track]} ${numIn(l)} · ${LVNAME[l.nivel]}</span><h1>${ESC(l.titulo)}</h1></div>`:''}
    <div class="steps" role="tablist">${keys.map((k,i)=>`<button type="button" role="tab" class="chip${k===step?' on':''}${okOf(k)?' ok':''}" data-s="${k}" aria-selected="${k===step}">${i+1}. ${STEP_DEFS[k]}</button>`).join('')}</div>
    <div id="stepbody" class="stack-lg"></div>
    <div class="stepnav">
      <button type="button" class="btn ghost" id="prev" ${si===0?'disabled':''}>‹ Anterior</button>
      <button type="button" class="btn primary" id="next">${si===keys.length-1?'Siguiente lección ›':'Siguiente ›'}</button>
    </div></div>`;
  const setStep=s=>go({name:'lesson',id:l.id,step:s});
  $view.querySelectorAll('.chip').forEach(b=>b.onclick=()=>setStep(b.dataset.s));
  const on=$view.querySelector('.chip.on'); if(on && mode()==='phone') on.scrollIntoView({inline:'center',block:'nearest'});
  document.getElementById('prev').onclick=()=>setStep(keys[si-1]);
  document.getElementById('next').onclick=()=>{ if(si<keys.length-1) setStep(keys[si+1]); else { const ls=trackLessons(l.track); const i=ls.indexOf(l); if(ls[i+1]) go({name:'lesson',id:ls[i+1].id,step:'para'}); else go({name:'track',track:l.track}); } };
  const body=document.getElementById('stepbody');
  const markChips=()=>{ $view.querySelectorAll('.chip').forEach(c=>c.classList.toggle('ok', okOf(c.dataset.s))); if(mode()==='laptop') renderSide(); };
  const edOpts = extra => Object.assign({lang, pkgs:l.pkgs}, extra);

  if(step==='para'){
    body.innerHTML=`<section class="stack">${mode()==='phone'?`<span class="eyebrow">${TRK[lang]} · ${LVNAME[l.nivel]}</span><h1>${ESC(l.titulo)}</h1>`:''}<p class="lead">${ESC(l.para)}</p></section>
    ${l.conecta?`<div class="box link"><b>Conecta con lo que ya sabes.</b> ${ESC(l.conecta)}</div>`:''}
    <div class="box info">En esta lección: ${l.comandos.length} comandos, 1 ejemplo para predecir, 1 ejemplo guiado${l.parsons?', 1 código para ordenar':''}, ${l.ejercicios.length} ejercicios${l.ejercicios.some(e=>e.tipo==='debug')?' (uno de encontrar el error)':''} y ${l.quiz.length} preguntas de repaso.${l.pkgs&&l.pkgs.includes('pandas')?' La primera vez que ejecutes, pandas tarda unos segundos en cargar.':''}</div>`;
  }
  if(step==='cmds'){
    body.innerHTML=`<section class="stack"><h2>Comandos de esta lección</h2><p class="muted small">Léelos una vez. No hace falta memorizarlos: los vas a usar en los siguientes pasos y siempre puedes volver aquí.</p></section>
    <div class="card"><div class="cmds">${l.comandos.map(cmdHTML).join('')}</div></div>
    ${l.errores?`<section class="stack"><h2>Errores comunes</h2><ul class="errs">${l.errores.map(e=>`<li><span>${ESC(e)}</span></li>`).join('')}</ul></section>`:''}`;
  }
  if(step==='ej'){
    const ex=l.ejemplo; let picked=null;
    const predHTML=`<div class="card stack"><b>1. Predice</b><p class="q enun">${ESC(ex.pregunta)}</p><div class="opts" id="popts"></div></div>`;
    const runHTML=`<div class="stack right"><b>2. Ejecuta</b><div id="exed"></div></div>`;
    const restHTML=`<div id="pfb" hidden></div>
      <details class="inv"><summary>3. Investiga: explica cada línea antes de abrir</summary><div class="in">${ex.notas.map(n=>`<div class="note"><code>${ESC(n[0])}</code><span>${ESC(n[1])}</span></div>`).join('')}</div></details>
      <div class="box info"><b>4. Modifica.</b> ${ESC(ex.modifica)}</div>`;
    const intro=`<section class="stack"><h2>Ejemplo</h2><p class="muted small">Primero predice. Equivocarte está bien: comparar lo que esperabas con lo que pasa es lo que fija el aprendizaje.</p></section>`;
    body.innerHTML = mode()==='laptop'
      ? intro+`<div class="split"><div class="stack left">${predHTML}${restHTML}</div>${runHTML}</div>`
      : intro+predHTML+runHTML+restHTML;
    const po=document.getElementById('popts');
    ex.opciones.forEach((o,i)=>{ const b=document.createElement('button'); b.type='button'; b.className='opt'; b.textContent=o; b.onclick=()=>{ picked=i; [...po.children].forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); }; po.appendChild(b); });
    const pfb=document.getElementById('pfb');
    const ed=editor(edOpts({code:ex.codigo, key:'x:'+l.id, mode:'run',
      gate:()=>{ if(picked===null && !pfb.dataset.done){ pfb.className='box warn'; pfb.textContent='Elige tu predicción antes de ejecutar.'; pfb.hidden=false; return false; } return true; },
      after:()=>{ if(pfb.dataset.done) return; pfb.dataset.done='1'; const right=picked===ex.correcta; pfb.className='box '+(right?'ok':'bad'); pfb.innerHTML=right?'<b>Tu predicción fue correcta.</b> Ahora abre "Investiga" y confirma por qué.':'<b>La respuesta era: '+ESC(ex.opciones[ex.correcta])+'.</b> Abre "Investiga" para ver qué línea lo explica.'; pfb.hidden=false; [...po.children].forEach((x,j)=>{ x.disabled=true; if(j===ex.correcta) x.classList.add('right'); else if(j===picked) x.classList.add('wrong'); }); }
    }));
    document.getElementById('exed').appendChild(ed);
  }
  if(step==='guia'){
    const g=l.guiado;
    body.innerHTML=`<div class="split"><div class="stack left">
      <section class="stack"><h2>Ejemplo guiado</h2><p class="enun">${ESC(g.enunciado)}</p></section>
      <div class="card stack"><b>Pasos</b><ol class="pasos">${g.pasos.map(p=>`<li>${ESC(p)}</li>`).join('')}</ol></div>
      <p class="small muted">Reemplaza cada <code>___</code> y presiona Comprobar.</p>
      <div class="btnrow"><button type="button" class="btn" id="gsol">Ver solución</button></div><div id="gsolbox" hidden></div>
    </div><div class="right" id="ged"></div></div>`;
    const ed=editor(edOpts({code:g.codigo, key:'g:'+l.id, mode:'check', tests:g.tests, solution:g.solucion, check:g.check, onPass:()=>{ S.done['g:'+l.id]=true; save(); markChips(); }}));
    document.getElementById('ged').appendChild(ed);
    solToggle('gsol','gsolbox',g.solucion);
  }
  if(step==='parsons'){
    const P=l.parsons;
    body.innerHTML=`<div class="split"><div class="stack left">
      <section class="stack"><h2>Ordena el código</h2><p class="enun">${ESC(P.enunciado)}</p></section>
      <p class="small muted">Toca los bloques en el orden correcto. Con ↑ subes una línea y con ✕ la devuelves. ${lang==='py'?'La indentación ya viene en cada bloque: fíjate en ella para saber qué va dentro de qué.':'Piensa en el orden de las cláusulas: SELECT, FROM, JOIN, WHERE, GROUP BY, HAVING, ORDER BY, LIMIT.'}</p>
      ${S.done['p:'+l.id]?'<div class="box ok"><b>Ya lo resolviste.</b> Puedes repetirlo para practicar.</div>':''}
    </div><div class="right" id="pz"></div></div>`;
    document.getElementById('pz').appendChild(parsonsBlock(l,()=>{ S.done['p:'+l.id]=true; save(); markChips(); }));
  }
  if(step==='ejer'){
    body.innerHTML=`<section class="stack"><h2>Ejercicios</h2><p class="muted small">Ahora sin huecos. Intenta al menos una vez antes de pedir pista; las pistas salen de una en una.</p>${refDetails(l)}</section><div id="exs" class="stack-lg"></div>`;
    const exs=document.getElementById('exs');
    l.ejercicios.forEach((e,i)=>{
      const k='e:'+l.id+':'+i;
      const card=document.createElement('section'); card.className='split';
      card.innerHTML=`<div class="stack left"><div class="exhead"><h3>Ejercicio ${i+1}</h3>${e.tipo==='debug'?'<span class="pill bug">Encuentra el error</span>':''}<span class="pill ${S.done[k]?'done':'new'}" id="st-${i}">${S.done[k]?'Resuelto':'Pendiente'}</span></div><p class="enun">${e.enunciado}</p><div class="hints stack"></div><div class="btnrow"><button type="button" class="btn hb">Pista 1 de ${e.pistas.length}</button><button type="button" class="btn sb">Ver solución</button></div><div class="solbox" hidden></div></div><div class="right edslot"></div>`;
      const ed=editor(edOpts({code:e.inicial, key:k, mode:'check', tests:e.tests, solution:e.solucion, check:e.check, onPass:()=>{ S.done[k]=true; save(); const p=document.getElementById('st-'+i); p.className='pill done'; p.textContent='Resuelto'; markChips(); }}));
      card.querySelector('.edslot').appendChild(ed);
      hintsAndSolution(card, e, ()=>!!S.done[k]);
      exs.appendChild(card);
    });
  }
  if(step==='rep'){
    body.innerHTML=`<section class="stack"><h2>Repaso rápido</h2><p class="muted small">Responde sin volver a mirar la lección. Recordar con esfuerzo es lo que hace que no se te olvide. Estas preguntas regresarán en la sección Repaso en los próximos días.</p></section><div id="qz" class="stack-lg"></div><div id="qsum"></div>`;
    const qz=document.getElementById('qz'); let n=0,ok=0;
    l.quiz.forEach((q,i)=>{ const c=document.createElement('div'); c.className='card'; c.appendChild(quizBlock(q, l.id+'-q'+i, right=>{ n++; if(right) ok++; if(n===l.quiz.length){ const sm=document.getElementById('qsum'); const st=lessonState(l); sm.innerHTML='<div class="box '+(ok===n?'ok':'info')+'"><b>'+ok+' de '+n+' correctas.</b> '+(st==='done'?'Lección completa.':'Te falta completar el guiado'+(l.parsons?', el código para ordenar':'')+' o algún ejercicio para terminar la lección.')+'</div>'; if(mode()==='phone') renderNav(); else renderSide(); } })); qz.appendChild(c); });
  }
}
function hintsAndSolution(card, e, isDone){
  let h=0; const hb=card.querySelector('.hb'), hints=card.querySelector('.hints');
  hb.onclick=()=>{ if(h<e.pistas.length){ const d=document.createElement('div'); d.className='hint'; d.textContent=e.pistas[h]; hints.appendChild(d); h++; } if(h>=e.pistas.length){ hb.disabled=true; hb.textContent='Sin más pistas'; } else hb.textContent='Pista '+(h+1)+' de '+e.pistas.length; };
  const sb=card.querySelector('.sb'), solbox=card.querySelector('.solbox');
  let armed=false;
  sb.onclick=()=>{
    if(!solbox.hidden){ solbox.hidden=true; sb.textContent='Ver solución'; armed=false; return; }
    if(!armed && !isDone()){ armed=true; sb.textContent='¿Seguro? Toca otra vez'; return; }
    solbox.className='solbox ed'; solbox.innerHTML='<div class="out">'+ESC(e.solucion)+'</div>'; solbox.hidden=false; sb.textContent='Ocultar solución';
  };
}
function solToggle(btnId, boxId, sol){
  const b=document.getElementById(btnId), box=document.getElementById(boxId);
  b.onclick=()=>{ if(box.hidden){ box.className='ed'; box.innerHTML='<div class="out">'+ESC(sol)+'</div>'; box.hidden=false; b.textContent='Ocultar solución'; } else { box.hidden=true; b.textContent='Ver solución'; } };
}

function viewReview(){
  const due=dueList();
  const qmap={}; L.forEach(l=>l.quiz.forEach((q,i)=>qmap[l.id+'-q'+i]={q,l}));
  const seenAny=Object.keys(S.srs).length>0;
  let pool=due.filter(k=>qmap[k]);
  let extra=false;
  if(!pool.length && seenAny){ pool=Object.keys(S.srs).filter(k=>qmap[k]); extra=true; }
  pool=pool.sort(()=>Math.random()-.5).slice(0,8);
  // Retos: ejercicios ya resueltos para rehacer desde cero, uno de cada lenguaje si se puede.
  const solved=Object.keys(S.done).filter(k=>k.startsWith('e:')).map(k=>{ const [,id,i]=k.split(':'); return byId[id]?{l:byId[id],i:+i}:null; }).filter(Boolean).sort(()=>Math.random()-.5);
  const retos=[]; ['py','sql'].forEach(t=>{ const r=solved.find(x=>x.l.track===t); if(r) retos.push(r); });
  if(!seenAny && !retos.length){
    $view.innerHTML=`<div class="stack-lg"><section class="hero"><span class="eyebrow">Repaso espaciado</span><h1>Aquí vuelve lo que ya estudiaste</h1><p class="muted">Cuando respondas el repaso rápido al final de una lección, esas preguntas aparecerán aquí en los días siguientes, mezcladas entre Python y SQL. También verás retos: ejercicios que ya resolviste, para rehacerlos desde cero.</p></section><button type="button" class="btn primary" id="gohome" style="align-self:flex-start">Ir a la primera lección</button></div>`;
    document.getElementById('gohome').onclick=()=>openLesson(ORDER[0].id);
    return;
  }
  $view.innerHTML=`<div class="stack-lg"><section class="hero"><span class="eyebrow">Repaso espaciado</span><h1>${pool.length&&!extra?'Repaso de hoy':'Estás al día'}</h1><p class="muted">${extra||!pool.length?'No tienes preguntas pendientes. Si quieres, practica con estas; los aciertos alargan el tiempo hasta la próxima vez.':'Preguntas mezcladas de las lecciones que ya hiciste. Si fallas una, vuelve hoy mismo; si aciertas, regresa en más días.'}</p></section>
  ${pool.length?'<section class="stack"><h2>Preguntas</h2><div id="rv" class="stack-lg"></div><div id="rvsum"></div></section>':''}
  ${retos.length?'<section class="stack"><h2>Retos: rehazlo sin mirar</h2><p class="small muted">Ejercicios que ya resolviste, desde el código inicial. Escribirlos otra vez de memoria es la práctica que más fija lo aprendido.</p><div id="retos" class="stack-lg"></div></section>':''}
  </div>`;
  if(pool.length){
    const rv=document.getElementById('rv'); let n=0,ok=0;
    pool.forEach(k=>{ const {q,l}=qmap[k]; const c=document.createElement('div'); c.className='card stack t-'+l.track;
      c.innerHTML='<span class="eyebrow">'+TRK[l.track]+' · '+ESC(l.titulo)+'</span>';
      c.appendChild(quizBlock(q,k,right=>{ n++; if(right) ok++; if(n===pool.length){ document.getElementById('rvsum').innerHTML='<div class="box '+(ok===n?'ok':'info')+'"><b>'+ok+' de '+n+' correctas.</b> '+(ok===n?'Excelente memoria.':'Las que fallaste vuelven pronto.')+'</div>'; if(mode()==='phone') renderNav(); else renderSide(); } }));
      rv.appendChild(c); });
  }
  if(retos.length){
    const box=document.getElementById('retos');
    retos.forEach(({l,i})=>{
      const e=l.ejercicios[i];
      const card=document.createElement('section'); card.className='split t-'+l.track;
      card.innerHTML=`<div class="stack left"><div class="exhead"><h3>${TRK[l.track]} · ${ESC(l.titulo)}</h3></div><p class="enun">${e.enunciado}</p><div class="hints stack"></div><div class="btnrow"><button type="button" class="btn hb">Pista 1 de ${e.pistas.length}</button><button type="button" class="btn sb">Ver solución</button></div><div class="solbox" hidden></div></div><div class="right edslot"></div>`;
      card.querySelector('.edslot').appendChild(editor({lang:l.track, pkgs:l.pkgs, code:e.inicial, key:null, mode:'check', tests:e.tests, solution:e.solucion, check:e.check}));
      hintsAndSolution(card, e, ()=>false);
      box.appendChild(card);
    });
  }
}

window.addEventListener('resize',()=>{ if(!S.device){ const want='m-'+autoDevice(); if(!document.body.classList.contains(want)) render(); } });
window.__ruta = {runPython, runSql, C};
render();
// Precarga discreta del motor del lenguaje abierto.
setTimeout(()=>{ const t=currentTrack(); if(t==='py') getPy().catch(()=>{}); if(t==='sql') getSql().catch(()=>{}); },1200);
})();
</script>
